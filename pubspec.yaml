name: pharmacist_dashboard
description: "A premium pharmacist management dashboard."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.6
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  printing: ^5.14.3
  pdf: ^3.12.0
  mobile_scanner: ^6.0.4

dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
